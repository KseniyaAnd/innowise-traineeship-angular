<div
  class="flex flex-col sm:flex-row p-6 gap-4 border-b-4"
>
  <div class="md:w-20 relative">
    <img
      class="block xl:block mx-auto rounded-border w-full"
      [src]="product.image"
      [alt]="product.title"
    />
  </div>
  <div class="flex flex-col md:flex-row justify-between flex-1 gap-6">
    <div class="flex flex-row md:flex-col justify-between items-start gap-2">
      <div>
        <div
          class="text-lg font-medium text-surface-900 dark:text-surface-0 overflow-ellipsis overflow-hidden whitespace-nowrap w-[30vw]">{{ product.title }}
        </div>
        <span class="font-medium text-secondary text-sm">{{ product.category }}</span>
      </div>
    </div>
    <div class="flex flex-col md:items-center">
      <span
        class="text-xl font-semibold text-surface-900 dark:text-surface-0">{{ product.price | currency: 'BYN ' }}</span>
      <div class="flex flex-row-reverse md:flex-row gap-2">
        <p-button
          variant="text"
          class="text-nowrap"
          [severity]="details? 'info' : 'success'"
          (click)="show()"
        >
          {{ details ? 'Hide' : 'Show' }} Details
        </p-button>
      </div>
    </div>
  </div>
</div>
