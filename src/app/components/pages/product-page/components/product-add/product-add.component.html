<form [formGroup]="form" (ngSubmit)="submit()">
  <input
    pInputText
    type="text"
    class="border w-full py-2 px-4 mb-2"
    placeholder="Product name"
    formControlName="title"
    appFocus
  >

  <p class="text-red-600 font-medium mb-2"
     *ngIf="title.errors?.minlength"
  > Please fill title field width min length
  </p>

  <div class="w-full flex justify-center">
    <p-progress-spinner *ngIf="loading" strokeWidth="8" animationDuration=".8s"
                        [style]="{ width: '50px', height: '50px' }" class="text-center"/>
  </div>


  <p-button
    type="submit"
    severity="success">
    Create
  </p-button>
</form>
