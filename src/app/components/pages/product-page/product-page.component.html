<input
  type="text"
  class="mb-2 border py-2 px-4 w-full"
  pInputText
  placeholder="Filter products"
  [(ngModel)]="term"
>

<p *ngIf="loading" class="text-center text-lg">Loading...</p>

<div *ngIf="productsService.products.length">
  <app-products-list [filterTerm]="term"
                     [productsArr]="products"
  ></app-products-list>
</div>

<button
  class="w-[48px] h-[48px] rounded-full bg-green-500 text-white fixed right-5 bottom-5 py-2 px-4"
  (click)="show()"
>+
</button>
