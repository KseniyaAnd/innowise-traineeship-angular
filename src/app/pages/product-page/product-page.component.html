<input
  type="text"
  class="mb-2 border py-2 px-4 w-full"
  pInputText
  placeholder="Filter products"
  [(ngModel)]="term"
>

<div class="w-full flex justify-center">
  <p-progress-spinner *ngIf="loading | async" strokeWidth="8" animationDuration=".8s"
                      [style]="{ width: '50px', height: '50px' }" class="text-center"/>
</div>

<div *ngIf="products | async as list">
  <app-products-list [filterTerm]="term"
                     [productsArr]="list"
  ></app-products-list>
</div>

<button
  class="w-[48px] h-[48px] rounded-full bg-green-500 text-white fixed right-5 bottom-5 py-2 px-4"
  (click)="show()"
>+
</button>
